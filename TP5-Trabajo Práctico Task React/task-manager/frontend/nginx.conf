# nginx sirve el build estatico de Vite y hace de proxy hacia la API.
# Asi el navegador habla con un solo origen (localhost:8080) y no hace falta CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* -> contenedor del backend (nombre del servicio en docker compose)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos con hash en el nombre (los genera Vite): se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cualquier otra ruta devuelve index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
