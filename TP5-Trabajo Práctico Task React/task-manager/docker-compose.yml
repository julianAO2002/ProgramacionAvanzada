services:
  db:
    image: postgres:16-alpine
    container_name: taskreact_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      # 5433 en el host para no chocar con un Postgres local (o el del TP3) en el 5432
      - "${DB_HOST_PORT}:5432"
    volumes:
      - taskreact_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: taskreact_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PORT: 3001
      # La "fecha de hoy" (alta y cierre de tareas) se calcula con esta zona horaria
      TZ: ${TZ}
    ports:
      - "${API_HOST_PORT}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: taskreact_web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT}:80"
    depends_on:
      - api

volumes:
  taskreact_pgdata:
